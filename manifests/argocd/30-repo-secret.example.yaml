# GitHub repository credentials for Argo CD when the source repo is private.
# To use:
#   1. Create a GitHub personal access token (classic) with `repo` scope.
#   2. Run:
#        kubectl -n argocd create secret generic platform-repo-creds \
#          --from-literal=type=git \
#          --from-literal=url=https://github.com/raihankhan/pulumi-kind-go-gitops-apps.git \
#          --from-literal=username=<github-username> \
#          --from-literal=password=<access-token>
#        kubectl -n argocd label secret platform-repo-creds argocd.argoproj.io/secret-type=repository
#   3. Update Application manifests to reference the secret:
#        source.repoURL: https://github.com/raihankhan/pulumi-kind-go-gitops-apps.git
#        source.plugin: {}
#        source.credentialsSecret: platform-repo-creds
#
# This file is committed as documentation only. The *real* Secret must NOT be
# checked into git. Use `scripts/bootstrap.sh` which handles this securely.
apiVersion: v1
kind: Secret
metadata:
  name: platform-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/raihankhan/pulumi-kind-go-gitops-apps.git
  username: REPLACE_ME
  password: REPLACE_ME
