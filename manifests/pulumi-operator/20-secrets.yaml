# Secret used by the Pulumi operator to authenticate to the Pulumi Cloud
# backend. When running fully offline, set PULUMI_BACKEND_URL to a `file://`
# location and the operator will instead use a local backend. This file is
# rendered by the Pulumi program using pulumi.Config().
#
# Example (replace with your own values):
#
#   pulumi config set --secret pulumi:accessToken <token>
#   pulumi config set --secret pulumi:organization <org>
#
# The `pulumi-kubernetes-operator` Helm chart ingests the secret via
# `extraSecretMounts`. We pre-create it here so RBAC is correct.
apiVersion: v1
kind: Secret
metadata:
  name: pulumi-kubernetes-operator
  namespace: pulumi-kubernetes-operator
  labels:
    app.kubernetes.io/name: pulumi-kubernetes-operator
type: Opaque
stringData:
  # see docs/SETUP.md for sourcing these safely
  PULUMI_ACCESS_TOKEN: "REPLACE_ME"
  PULUMI_ORGANIZATION: "REPLACE_ME"
  PULUMI_BACKEND_URL: "https://api.pulumi.com"
