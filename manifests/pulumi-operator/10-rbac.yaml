# ServiceAccount + ClusterRole for the Pulumi Kubernetes Operator.
# The operator needs cluster-wide access to manage any Stack CRs the platform
# admins create. Granular roles are layered on top via the `pulumicli` stack
# runner config when needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulumi-kubernetes-operator
  namespace: pulumi-kubernetes-operator
  labels:
    app.kubernetes.io/name: pulumi-kubernetes-operator
    app.kubernetes.io/component: rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pulumi-kubernetes-operator
  labels:
    app.kubernetes.io/name: pulumi-kubernetes-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["pulumi.com"]
    resources: ["stacks", "stacks/status", "programs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulumi-kubernetes-operator
  labels:
    app.kubernetes.io/name: pulumi-kubernetes-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulumi-kubernetes-operator
subjects:
  - kind: ServiceAccount
    name: pulumi-kubernetes-operator
    namespace: pulumi-kubernetes-operator
