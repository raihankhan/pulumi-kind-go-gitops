name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-flight CI runs on the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          check-latest: true

      # `make build`, `make test` and `go vet ./...` all need the modules
      # downloaded; `cache: true` above handles this implicitly.

      - name: download modules
        run: go mod download

      - name: go mod verify
        run: go mod verify

      - name: build
        run: make build

      - name: vet
        run: go vet ./...

      - name: test
        run: make test
